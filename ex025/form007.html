<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="" method="get">
        <label for="iest">Estado</label>
        <select name="Estado" id="iest">
            <option value="">--- Escolha ---</option>
            <optgroup label="Região Sul">
                <option value="SP">SP</option>
                <option value="SC">SC</option>
                <option value="RJ">RJ</option>
            </optgroup>
            <optgroup label="Região Nordeste">
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="MA">MA</option>
                <option value="TO">TO</option>
            </optgroup>
        </select>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="lstprof">
        </p>
        <datalist id="lstprof">
            <option value="ADM">Administrador</option>
            <option value="CONT">Contador</option>
            <option value="DEV">Desenvolvedor</option>
            <option value="PROF">Professor</option>
        </datalist>

        <p>
            <label for="imsg">Mensagem: </label>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua mensagem"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
