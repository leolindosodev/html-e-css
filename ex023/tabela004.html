<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 004</title>
    <style>
        table{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: capitalize;
            border-collapse: collapse;
        }
        thead{
            background-color: lightgrey;
        }
        thead th {
            text-transform: uppercase;
        }
        td, th{
            padding: 10px;
            border: 1px solid rgba(0, 0, 0, 0.356);
        }
        tbody tr th {
            background-color: rgba(120, 42, 165, 0.322);
        }
        .homens{
            background-color: rgba(173, 216, 230, 0.336);
        }
        .mulheres{
            background-color: rgba(255, 182, 193, 0.336);
        }
    </style>
</head>
<body>
    <table>
        <caption>
            filmes favoritos
        </caption>
        <thead>
            <tr>
                <th scope="col">grupos</th>
                <th scope="col">nomes</th>
                <th colspan="3" scope="colgroup">filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr class="mulheres">
                <th rowspan="3" scope="rowgroup">mulheres</th>
                <td>ana marina santos</td>
                <td>alien</td>
                <td>rambo</td>
                <td>vingadores</td>
            </tr>
            <tr class="mulheres">
                <td>beatriz souza</td>
                <td>hulk</td>
                <td>inception</td>
                <td>batman</td>
            </tr>
            <tr class="mulheres">
                <td>claudia melo</td>
                <td>oblivion</td>
                <td>matrix</td>
                <td>big hero</td>
            </tr>
            <tr class="homens">
                <th rowspan="3" scope="rowgroup">homens</th>
                <td>bruno mendonça</td>
                <td>intocáveis</td>
                <td>amnésia</td>
                <td>gladiador</td>
            </tr>
            <tr class="homens">
                <td>daniel lourenço</td>
                <td>wall-e</td>
                <td>oldboy</td>
                <td>dangal</td>
            </tr>
            <tr class="homens">
                <td>fabio mota</td>
                <td>star war 5</td>
                <td>taxi driver</td>
                <td>toy story</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
