<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            width: 500px;
        }
        td, th{
            border: 1px solid black;
        }
        thead, tfoot{
            background-color: gray;
        }
    </style>
</head>
<body>

            <tr>

            </tr>
            <tr>

</html>
