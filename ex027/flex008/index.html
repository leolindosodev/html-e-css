<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box - Align Self</title>
    <style>
        div.container{
            display: flex;
            flex-flow: row wrap;
            background-color: salmon;
            height: 200px;
            align-items: flex-start;
        }
        .item{
            background-color: lightseagreen;
            border: 1px solid black;
    
            padding: 20px;
            text-align: center;
        }
        div#i1{
            align-self: auto; /*O auto ou inherit, ele herda a propriedade do pai, que é Align-itens: flex-start;*/
        }div#i2{
            align-self: flex-start;
        }
        div#i3{
            align-self: flex-end;
        }div#i4{
            align-self: center;
        }
        div#i5{
            align-self: stretch; /* Padrão */
        }
            
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
    </div>
</body>
</html>
