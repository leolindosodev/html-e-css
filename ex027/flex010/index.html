<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            flex-flow: row nowrap;
            background-color: salmon;
        }
        .item{
            background-color: lightseagreen;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            flex-shrink: 1; /* Ele só funciona dois valores "0" ou qualquer número que sejá positivo (Como se fosse um boolean). Onde 0 ele não permite encolher e 1 ele permite encolher*/
            flex-grow: 1; /* 0 não permite crescer e qualquer número positivo permite o crescimento*/
            /*Quando utilizamos flex-grow: 1; com "WRAP", o item que quebrou a linha tem a tendência de ocupar todo o espaço */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
