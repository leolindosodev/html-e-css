<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            flex-flow: row nowrap;
            background-color: salmon;
        }
        .item{
            background-color: lightseagreen;
            border: 1px solid black;
            text-align: center;
            
        }
        #i1{
            flex: 1 0 200px;

           /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;*/    
        }
        #i2{
            flex: 1 1 200px;

            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 200px;*/
        }
        #i3{
            flex: 1 3 200px;

           /*flex-shrink: 3;
           flex-grow: 1;
           flex-basis: 200px;*/ 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
</body>
</html>
