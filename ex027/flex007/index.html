<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            flex-flow: row wrap;
            background-color: salmon;
        }
        .item{
            background-color: lightseagreen;
            border: 1px solid black;
    
            padding: 20px;
            text-align: center;
        }
        div#i1{
            order: -2;
        }div#i2{
            order: 4;
        }
         div#i3{
            order: 8;
        }div#i4{
            order: 2;
        }
         div#i5{
            order: 0;
        }div#i6{
            order: 2;
        }
         div#i7{
            order: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
