<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <!--As configurações de CSS para ajuste de tamanho tem mais precedência em relação as configurações inline do <iframe>-->
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!--Tamanho padrão de um iframe 300"width" x 150"height"-->
    <!--o atributo scrolling do <iframe>, permite que o site carregado tenha barra de rolagem ou não-->
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="yes"> 
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
    </iframe> para aprender a programar</p>
    <p>o site do <iframe src="https://www.estudonauta.com/" frameborder="0"></iframe> também é legal, pena que ãp funciona dentro do &lt;iframe&gt;;</p>
    <p>
        o repositorio do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io">
            Repositorio do Guanabara no GitHub</a>
        </iframe>
    </p>
</body>
</html>
